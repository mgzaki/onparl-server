management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# OTP Configuration
otp.length=6
otp.expiry.minutes=5
otp.max.attempts=3
otp.rate.limit.seconds=60

# SMS Configuration (AWS SNS)
sms.sender.id=Onparl
sms.mock.enabled=true

# AWS SNS Configuration (Production)
# Set sms.mock.enabled=false in production and provide AWS credentials
# aws.sns.region=us-east-1

# AWS S3 Configuration (Profile Pictures)
aws.s3.bucket-name=onparl-profile-pictures-dev
aws.s3.profile-pictures-prefix=profile-pictures/
aws.region=us-east-1
# For LocalStack in development:
# aws.s3.endpoint=http://localhost:4566
